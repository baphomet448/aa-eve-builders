<style>
    #{{ table_id }} [data-sort] { cursor: pointer; user-select: none; }
    #{{ table_id }} [data-sort]:hover { text-decoration: underline; }
    #{{ table_id }} .sorted-asc::after { content: " \25B2"; }
    #{{ table_id }} .sorted-desc::after { content: " \25BC"; }

    /* A compact table: the page has many columns */
    #{{ table_id }} { font-size: 0.9rem; }
    #{{ table_id }} th,
    #{{ table_id }} td { padding: 0.25rem 0.4rem; vertical-align: middle; }
    #{{ table_id }} th { white-space: normal; line-height: 1.15; vertical-align: bottom; }
    #{{ table_id }} img { width: 22px; height: 22px; }
    #{{ table_id }} .evb-copy { font-size: 0.8rem; }
    #{{ table_id }} .badge { font-size: 0.75rem; }
</style>
<script>
    // Click on a title in the header sorts the table by that column: the first click
    // upwards, the second downwards, the third one brings back the order from the server.
    // A title is a header cell or a span inside one (a header of two lines has two
    // titles, each sorts by its own value). A cell is sorted by its data-value, or by
    // data-value2 for a title with data-sort-field="value2". Equal values keep the
    // order from the server.
    document.addEventListener("DOMContentLoaded", function () {
        const table = document.getElementById("{{ table_id }}");
        if (!table) {
            return;
        }

        const body = table.tBodies[0];
        const titles = table.querySelectorAll("thead [data-sort]");
        const positions = new Map(
            Array.from(body.rows).map(function (row, position) {
                return [row, position];
            })
        );

        function valueOf(row, index, type, field) {
            const cell = row.cells[index];
            const raw = cell.dataset[field] !== undefined ? cell.dataset[field] : cell.textContent.trim();

            return type === "number" ? parseFloat(raw) : raw.toLowerCase();
        }

        function show(rows) {
            rows.forEach(function (row) {
                body.appendChild(row);
            });
        }

        titles.forEach(function (title) {
            title.addEventListener("click", function () {
                const index = title.closest("th").cellIndex;
                const type = title.dataset.sort;
                const field = title.dataset.sortField || "value";
                const before = title.dataset.direction;

                titles.forEach(function (other) {
                    delete other.dataset.direction;
                    other.classList.remove("sorted-asc", "sorted-desc");
                });

                const rows = Array.from(body.rows);

                if (before === "desc") {
                    // The third click: back to the order from the server
                    rows.sort(function (a, b) {
                        return positions.get(a) - positions.get(b);
                    });
                    show(rows);

                    return;
                }

                const direction = before === "asc" ? "desc" : "asc";
                const sign = direction === "asc" ? 1 : -1;
                title.dataset.direction = direction;
                title.classList.add("sorted-" + direction);

                rows.sort(function (a, b) {
                    const x = valueOf(a, index, type, field);
                    const y = valueOf(b, index, type, field);

                    if (x < y) {
                        return -sign;
                    }
                    if (x > y) {
                        return sign;
                    }

                    return positions.get(a) - positions.get(b);
                });
                show(rows);
            });
        });
    });
</script>
