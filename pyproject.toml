[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-eve-builders"
description = """\
    Corporate build orders for Alliance Auth: builders take parts of an order and deliver them through in-game \
    contracts that the plugin checks and credits\
    """
readme = "README.md"
keywords = [
    "allianceauth",
    "build orders",
    "contracts",
    "eve online",
    "evebuilders",
    "industry",
]
license = { file = "LICENSE" }
authors = [
    { name = "baphomet448", email = "baphomet448@gmail.com" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5",
    "django-eveuniverse>=2.2",
    "requests",
]
urls.Changelog = "https://github.com/baphomet448/aa-eve-builders/blob/main/CHANGELOG.md"
urls.Homepage = "https://github.com/baphomet448/aa-eve-builders"
urls.Source = "https://github.com/baphomet448/aa-eve-builders"
urls.Tracker = "https://github.com/baphomet448/aa-eve-builders/issues"

[tool.hatch]
version.path = "evebuilders/__init__.py"
build.include = [
    "/evebuilders",
]
