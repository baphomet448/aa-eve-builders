# Build the package and attach it to the GitHub release.
# This workflow runs when a release is published on GitHub.
#
# Publishing to PyPI is not set up. To enable it later, add a Trusted Publisher on
# PyPI (https://docs.pypi.org/trusted-publishers/), then add these back:
#   - "id-token: write" under permissions and an "environment" for the job
#   - a step "uses: pypa/gh-action-pypi-publish@release/v1" after "Package"

name: Release

on:
  release:
    # https://docs.github.com/en/actions/reference/events-that-trigger-workflows#release
    types: [released, prereleased]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v7

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml' # Read the Python version from the pyproject.toml file

      # Install Tools
      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      # Build Package
      - name: Package
        run: |
          python -m build

      # Add Assets to Release on GitHub
      - name: Add Assets to Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The name of the file(s) to upload
          files: |
            dist/*.tar.gz
            dist/*.whl